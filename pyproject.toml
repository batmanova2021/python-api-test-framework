[project]
name = "python-api-test-framework"
version = "0.1.0"
description = "pytest API tests for JSONPlaceholder and Rick and Morty"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.1",
    "faker>=40.39.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pylint-pytest>=1.1.7",
    "ruff>=0.16.8",
    "types-requests",
    "types-jsonschema",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --strict-config --import-mode=importlib --alluredir=allure-results"
markers = [
    "smoke: critical API health checks",
    "regression: detailed API behavior and contract checks",
    "jsonplaceholdertest: JSONPlaceholder API tests (legacy marker)",
    "rickandmorty: Rick and Morty API tests (legacy marker)",
    "unit: local framework tests without external HTTP requests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "RUF"]

[tool.pylint.MAIN]
py-version = "3.14"
jobs = 0  # Auto-detect number of CPUs
persistent = false
load-plugins = ["pylint_pytest"]

[tool.pylint.FORMAT]
max-line-length = 100
max-module-lines = 1000

[tool.pylint.MESSAGES_CONTROL]
disable = [
    # --- Test-specific false positives (handled by pylint-pytest plugin) ---
    "redefined-outer-name",          # pytest fixtures
    "unused-argument",               # fixtures passed to tests

    # --- Style preferences ---
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",        # API test classes often have few methods
    "duplicate-code",                # Some duplication in test data is acceptable

    # --- Design ---
    "too-many-arguments",            # API test functions often need many params
    "too-many-locals",
    "too-many-instance-attributes",

    # --- Import handling for pytest ---
    "import-error",                  # pytest pythonpath handles this
]

enable = [
    "unused-import",
    "unused-variable",
    "undefined-variable",
    "missing-timeout",               # Critical for API tests: always set timeouts!
]

[tool.pylint.DESIGN]
max-args = 10
max-locals = 20

[tool.pylint.SIMILARITIES]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.mypy]
python_version = "3.14"
files = ["config"]
check_untyped_defs = true
disallow_untyped_defs = true
