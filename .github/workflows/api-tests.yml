name: API Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  JSONPLACEHOLDER_BASE_URL: ${{ vars.JSONPLACEHOLDER_BASE_URL || 'https://jsonplaceholder.typicode.com' }}
  RICK_AND_MORTY_BASE_URL: ${{ vars.RICK_AND_MORTY_BASE_URL || 'https://rickandmortyapi.com/api' }}
  API_TIMEOUT: ${{ vars.API_TIMEOUT || '10' }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pylint tests/ config/ --fail-under=8.0
      - run: uv run mypy
      - run: uv run pytest -m unit

  api-tests:
    name: API Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Run smoke tests
        run: uv run pytest -m smoke -v --junitxml=junit-results/smoke.xml

      - name: Run regression tests
        run: uv run pytest -m regression -v --junitxml=junit-results/regression.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit-results/
            allure-results/
          retention-days: 14
